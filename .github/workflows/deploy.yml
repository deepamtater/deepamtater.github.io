name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Reads the repo's Pages settings: origin (https://<owner>.github.io)
      # and base path ("" for a <owner>.github.io repo, "/<repo>" otherwise).
      - name: Detect Pages URL
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Astro
        uses: withastro/action@v6
        env:
          # Override with repository variables (Settings → Variables) if needed,
          # e.g. once a custom domain is added.
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.origin }}
          BASE_PATH: ${{ vars.BASE_PATH || steps.pages.outputs.base_path || '/' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
